<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<title>水墨斩 · OpenPixel</title>
<meta name="claude:viewport-fit-sides" content="cover">


<style>
/* layout: a workbench (big player + frame sheet) on top, a wall of looping effect cards below, filtered by category */
:root{
  --bg:#0f0e17; --panel:#17162a; --line:#2a2945; --fg:#ece8f6; --dim:#9893b3; --accent:#ffd85e; --hot:#f4701d;
  --f-disp:"ZCOOL QingKe HuangYou","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-num:"DotGothic16",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(30px,5vw,44px);line-height:1.05;margin:0;letter-spacing:.04em;color:var(--accent);text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-size:13px;color:var(--dim);letter-spacing:.02em;margin-top:6px;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;color:var(--dim);background:transparent;border:1px solid var(--line);border-radius:3px;padding:3px 10px;cursor:pointer}
.chip[aria-pressed="true"]{color:#1a1206;background:var(--accent);border-color:var(--accent)}
.chip:focus-visible,.btn:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* workbench */
.bench{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px}
@media (max-width:860px){.bench{grid-template-columns:minmax(0,1fr)}}
.stagebox{display:flex;flex-direction:column;gap:10px;min-width:0}
.screen{display:flex;justify-content:center;align-items:center;background:#07060c;border-radius:2px;overflow:hidden}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;max-width:100%}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{font:inherit;font-size:13px;color:var(--fg);background:#221f3a;border:1px solid var(--line);border-radius:3px;padding:4px 10px;cursor:pointer;min-width:34px}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.fc{font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;margin-left:auto}
.info{display:flex;flex-direction:column;gap:10px;min-width:0}
.info h2{font-family:var(--f-disp);font-weight:400;font-size:30px;margin:0;line-height:1.1}
.tag{font-size:12px;color:var(--dim);letter-spacing:.06em}
.info p{margin:0;color:#cfcae2}
.notes{margin:0;padding-left:18px;color:var(--dim);font-size:13px}
.sheetbox{overflow-x:auto;background:#07060c;border-radius:2px;padding:6px}
.sheetbox canvas{cursor:pointer}
.sheetlbl{font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
/* wall */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:6px;background:transparent;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.card .scr{background:#07060c;border:1px solid var(--line);border-radius:2px;overflow:hidden;display:flex;justify-content:center}
.card[aria-current="true"] .scr{border-color:var(--accent)}
.card .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card b{font-weight:500;font-size:15px}
.card span{font-family:var(--f-num);font-size:12px;color:var(--dim)}
.card i{font-style:normal;font-size:12.5px;color:var(--dim);line-height:1.45}
footer{color:var(--dim);font-size:12.5px}
@media (prefers-reduced-motion:reduce){.card .scr canvas{opacity:.92}}
</style>
<div class="wrap">
  <nav aria-label="作品导航" style="display:flex;gap:16px;padding:0 0 14px;font:14px/1.5 system-ui"><a href="../../index.html#collection" style="color:inherit">← 返回合集</a><a href="source.html" style="color:inherit">查看源码</a><a href="https://github.com/ma1902056219-coder/openpixel/blob/main/works/ink-slash/README.md" style="color:inherit">操作说明</a></nav>
  <header>
    <h1>水墨斩</h1>
    <nav class="chips" id="chips" aria-label="分类"></nav>
  </header>
  <section class="bench" aria-label="工作台">
    <div class="stagebox">
      <div class="screen"><canvas id="big" width="640" height="384"></canvas></div>
      <div class="ctrl">
        <button class="btn" id="play" aria-pressed="true" title="空格">暂停</button>
        <button class="btn" id="prev" title="←">◀ 帧</button>
        <button class="btn" id="next" title="→">帧 ▶</button>
        <button class="btn" id="replay" title="R">重播</button>
        <span class="sep"></span>
        <button class="btn spd" data-s="0.25">¼</button>
        <button class="btn spd" data-s="0.5">½</button>
        <button class="btn spd" data-s="1" aria-pressed="true">1×</button>
        <span class="sep"></span>
        <button class="btn bgm" data-b="stage" aria-pressed="true">舞台</button>
        <button class="btn bgm" data-b="dark">纯黑</button>
        <button class="btn bgm" data-b="check">格子</button>
        <button class="btn" id="onion" aria-pressed="false" title="O">洋葱皮</button>
        <span class="fc" id="fc">帧 1 / 1</span>
      </div>
    </div>
    <div class="info">
      <div class="tag" id="itag"></div>
      <h2 id="iname"></h2>
      <p id="idesc"></p>
      <ul class="notes" id="inotes"></ul>
      <div class="sheetlbl"><span>逐帧表（点击跳到该帧）</span><span id="ishape"></span></div>
      <div class="sheetbox"><canvas id="sheet"></canvas></div>
    </div>
  </section>
  <section class="wall" id="wall" aria-label="全部动效"></section>
  <footer id="foot"></footer>
</div>
<script src="source.js"></script>
