<style>
/* layout: one big integer-scaled stage, transport bar under it, six thumbnail tabs, notes below */
:root{
  --bg:#121018; --panel:#1a1722; --panel2:#221e2d; --line:#2e2a3b; --fg:#ece7f4; --muted:#a19ab3; --accent:#f2c14e; --accent-ink:#1b1408;
  --f-disp:"ZCOOL QingKe HuangYou","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-body:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --f-px:"Silkscreen",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-family:var(--f-px);font-size:11px;letter-spacing:.12em;color:var(--accent);margin:0;text-transform:uppercase}
h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(30px,5.4vw,46px);line-height:1.1;margin:4px 0 0;text-wrap:balance}
.lede{margin:8px 0 0;color:var(--muted);max-width:60ch}
.stage{background:#000;border:1px solid var(--line);display:flex;justify-content:center;align-items:center;min-height:120px;overflow:hidden}
.stage canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-top:0;padding:10px 12px}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grp .lab{color:var(--muted);font-size:13px}
button,.seg button{font:inherit;font-size:13px;color:var(--fg);background:var(--panel2);border:1px solid var(--line);padding:4px 10px;cursor:pointer;line-height:1.4}
button:hover{border-color:#4a4560}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:flex}
.seg button+button{border-left:0}
.play{min-width:64px}
input[type=range]{accent-color:var(--accent);width:120px}
.info{margin-left:auto;font-family:var(--f-px);font-size:11px;color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums;text-align:right}
.ctl{display:contents}
.tabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:760px){.tabs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tab{display:flex;flex-direction:column;gap:6px;padding:6px;text-align:left;background:var(--panel)}
.tab canvas{width:100%;aspect-ratio:16/10;object-fit:cover;image-rendering:pixelated;background:#000;display:block}
.tab .tl{display:flex;gap:6px;align-items:baseline;font-size:13px}
.tab .k{font-family:var(--f-px);font-size:10px;color:var(--muted)}
.tab.on{border-color:var(--accent);background:var(--panel2);color:var(--fg)}
.tab.on .k{color:var(--accent)}
.notes{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;padding-top:6px}
@media (max-width:760px){.notes{grid-template-columns:minmax(0,1fr)}}
.notes h2{font-family:var(--f-disp);font-weight:400;font-size:28px;margin:0;line-height:1.2}
.notes p{margin:6px 0 0;max-width:62ch}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.chips li{border:1px solid var(--line);padding:2px 8px;font-size:13px;color:var(--fg)}
.chips .h{width:100%;font-family:var(--f-px);font-size:10px;letter-spacing:.1em;color:var(--muted);border:0;padding:0}
.keys{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:12px}
.keys kbd{font-family:var(--f-px);font-size:10px;border:1px solid var(--line);padding:0 4px;color:var(--fg)}
