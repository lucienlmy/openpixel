<style>
/* layout: one cabinet — a black stage with the game, a slim control rail under it, the games as cartridges below */
:root{--bg:#0b0a10;--panel:#14121c;--line:#2a2638;--fg:#ece8f6;--dim:#9a93b0;--accent:#ff3d8b;--accent2:#3ef0ff;
  --disp:"ZCOOL QingKe HuangYou","Chakra Petch",system-ui,sans-serif;--ui:"Chakra Petch","PingFang SC","Noto Sans SC",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1500px;margin:0 auto;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{font-family:var(--disp);font-weight:400;font-size:clamp(28px,4vw,44px);margin:0;letter-spacing:.04em;text-wrap:balance}
h1 b{color:var(--accent);font-weight:400}
.lede{color:var(--dim);margin:0;max-width:70ch;line-height:1.6;font-size:14px}
#stage{position:relative;background:#000;border:1px solid var(--line);display:flex;justify-content:center;align-items:center;min-height:200px;overflow:hidden}
#cv{display:block;image-rendering:pixelated;max-width:100%;touch-action:none;outline:none}
#cv:focus-visible{outline:2px solid var(--accent2)}
#hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:#fff;opacity:.72;pointer-events:none;text-shadow:0 1px 2px #000}
.rail{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button,.btn{font:inherit;font-size:13px;color:var(--dim);background:var(--panel);border:0;padding:6px 11px;cursor:pointer}
.btn{border:1px solid var(--line);border-radius:3px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on,.btn.on{color:var(--fg);background:#2a1630;box-shadow:inset 0 -2px 0 var(--accent)}
button:focus-visible{outline:2px solid var(--accent2);outline-offset:1px}
.lab{font-size:12px;color:var(--dim);letter-spacing:.08em}
#info{margin-left:auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.carts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.cart{display:grid;gap:8px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px;color:var(--fg);font:inherit;cursor:pointer}
.cart canvas{width:100%;aspect-ratio:16/9;max-width:100%;image-rendering:pixelated;background:#000;display:block}
.cart .nm{font-family:var(--disp);font-size:18px;letter-spacing:.04em}
.cart .ref{font-size:12px;color:var(--dim)}
.cart.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.notes{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;border-top:1px solid var(--line);padding-top:14px}
.notes h2{font-family:var(--disp);font-weight:400;font-size:24px;margin:0 0 6px}
.notes p{margin:0 0 10px;line-height:1.7;color:#cfc9de;max-width:68ch}
.notes ul{margin:0;padding-left:18px;line-height:1.7;color:#cfc9de}
.notes .h{font-size:12px;letter-spacing:.12em;color:var(--accent2);margin-bottom:6px}
@media (max-width:760px){.carts{grid-template-columns:repeat(2,minmax(0,1fr))}.notes{grid-template-columns:minmax(0,1fr)}#info{margin-left:0;width:100%}}
